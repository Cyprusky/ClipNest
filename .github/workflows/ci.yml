name: macOS build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Unit tests
        timeout-minutes: 6
        run: ./scripts/build.sh test-all
      - name: HTML external resource regression
        if: ${{ !cancelled() }}
        run: python3 scripts/check-html-network.py
      - name: Test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            .build/DerivedData/Logs/Test
            .build/html-network/results.json
          retention-days: 5
